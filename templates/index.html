<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Credit Card Approval Predictor</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="{{ url_for('static', path='css/styles.css') }}">
  <style>
    :root {
      --primary-color: #4f46e5;
      --primary-hover: #4338ca;
      --success-bg: #dcfce7;
      --success-border: #22c55e;
      --success-text: #15803d;
      --error-bg: #fee2e2;
      --error-border: #ef4444;
      --error-text: #b91c1c;
      --neutral-50: #f9fafb;
      --neutral-100: #f3f4f6;
      --neutral-200: #e5e7eb;
      --neutral-700: #374151;
      --neutral-900: #111827;
      --error-light: #fef2f2;
    }

    body {
      font-family: 'Inter', sans-serif;
      background-color: var(--neutral-100);
      padding: 2rem;
    }

    .container {
      max-width: 800px;
      margin: auto;
      background: white;
      padding: 2rem;
      border-radius: 1rem;
    }

    h1 {
      text-align: center;
      margin-bottom: 1.5rem;
    }

    .form-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 1.5rem;
    }

    label {
      display: block;
      margin-bottom: 0.5rem;
      font-weight: 500;
      color: var(--neutral-700);
    }

    input,
    select {
      width: 100%;
      padding: 0.75rem;
      border: 1px solid var(--neutral-200);
      border-radius: 0.5rem;
    }

    button {
      background: var(--primary-color);
      color: white;
      padding: 0.75rem;
      border: none;
      border-radius: 0.5rem;
      width:
        100%;
    }

    .prediction {
      margin-top: 1.5rem;
      display: none;
      padding: 1.5rem;
      text-align: center;
      border-radius: 0.5rem;
    }

    .prediction.approved {
      background: var(--success-bg);
      border: 2px solid var(--success-border);
      color:
        var(--success-text);
    }

    .prediction.rejected {
      background: var(--error-bg);
      border: 2px solid var(--error-border);
      color: var(--error-text);
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Credit Card Approval Predictor</h1>
    <form id="approvalForm">
      <div class="form-grid">
        <div class="form-group">
          <label for="income">Annual Income (₹)</label>
          <input type="text" id="income" name="Income" class="currency" required placeholder="Enter annual income"
            oninput="formatIndianNumber(this)">
        </div>

        <div class="form-group">
          <label for="debt">Current Debt (₹)</label>
          <input type="text" id="debt" name="Debt" class="currency" required placeholder="Enter current debt"
            oninput="formatIndianNumber(this)">
        </div>

        <div class="form-group">
          <label for="credit_score">Credit Score</label>
          <input type="number" id="credit_score" name="CreditScore" required min="00" max="850">
        </div>

        <div class="form-group">
          <label for="age">Age</label>
          <input type="number" id="age" name="Age" required min="18" max="100">
        </div>

        <div class="form-group">
          <label for="years_employed">Years Employed</label>
          <input type="number" id="years_employed" name="YearsEmployed" required min="0" max="50" step="0.1">
        </div>

        <div class="form-group">
          <label for="employed">Currently Employed</label>
          <select id="employed" name="Employed" required>
            <option value="">Select</option>
            <option value="1">Yes</option>
            <option value="0">No</option>
          </select>
        </div>

        <div class="form-group">
          <label for="prior_default">Prior Default History</label>
          <select id="prior_default" name="PriorDefault" required>
            <option value="">Select</option>
            <option value="1">No previous defaults</option>
            <option value="0">Has previous defaults</option>
          </select>
        </div>
      </div>

      <button type="submit">Predict Approval</button>
    </form>

    <div id="result" class="prediction">
      <h2>Prediction Result</h2>
      <p id="predictionText"></p>
    </div>
  </div>

  <script>
    function formatIndianNumber(input) {
      let value = input.value.replace(/[^\d.]/g, "");
      if (value) {
        let number = parseFloat(value);
        if (!isNaN(number)) {
          input.value = "₹" + number.toLocaleString('en-IN');
        }
      }
    }

    document.getElementById("approvalForm").addEventListener("submit", async (e) => {
      e.preventDefault();

      const formData = new FormData(e.target);
      const data = {};

      for (let [key, value] of formData.entries()) {
        if (key === "Income" || key === "Debt") {
          data[key] = parseFloat(value.replace(/[₹,]/g, ""));
        } else {
          data[key] = parseFloat(value);
        }
      }

      try {
        const response = await fetch("/predict", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(data)
        });

        const result = await response.json();
        const resultDiv = document.getElementById("result");
        const predictionText = document.getElementById("predictionText");

        resultDiv.style.display = "block";
        if (result.approval) {
          resultDiv.className = "prediction approved";
          predictionText.innerHTML = ` Congratulations! Your credit card application is likely to be approved.${result.confidence ? ` (Confidence: ${result.confidence})` : ''
            }`;
        } else {
          resultDiv.className = "prediction rejected";
          predictionText.innerHTML = ` Sorry, your credit card application might not be approved at this time.${result.confidence ? ` (Confidence: ${result.confidence})` : ''
            }`;
        }
      } catch (error) {
        console.error("Error:", error);
        alert("An error occurred while processing your request. Please try again.");
      }
    });
  </script>
</body>

</html>
